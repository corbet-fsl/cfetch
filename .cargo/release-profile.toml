# Release profiles for cfetch, NOT auto-loaded: cargo only reads
# `.cargo/config.toml` automatically, never this file. Every release build
# passes it explicitly with `--config .cargo/release-profile.toml`, so plain
# `cargo build`/`cargo test` (and CI's `cargo check --release`, which never
# runs LTO/strip) stay on cargo's defaults. See docs/self-build-performance.md.
[profile.release]
lto = "thin"
strip = true

[profile.release-max]
# Self-hosted maximum-performance build: everything `release` carries, plus
# whole-program LTO and single-CGU codegen. The distributed binaries stay on
# the portable `release` baseline — this profile is for a binary that never
# leaves the machine it was built on. See docs/self-build-performance.md.
inherits = "release"
lto = "fat"
codegen-units = 1
